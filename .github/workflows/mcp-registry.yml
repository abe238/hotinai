name: MCP Registry

# Listing hotin in the official registry, so a client can find it without being
# told its name. Split from publish.yml deliberately: the registry verifies
# against whatever PyPI already serves, so re-listing must not require cutting a
# release. The first attempt failed on a bad download URL, and re-running it
# should never have cost a version number -- hence workflow_dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    name: Publish to the official MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # github-oidc login; no token is stored or pasted anywhere
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          # -f, not just -sL. Without it curl prints a 404 page to stdout, tar
          # says "not in gzip format", and the real cause is two lines up. That
          # is exactly how this failed the first time.
          #
          # /releases/latest/download/<asset>, not /releases/download/latest/.
          # The second form needs a tag literally named "latest"; this repo tags
          # v1.8.0 and friends, so it 404s. Verified both forms by hand.
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help > /dev/null
      - name: Wait for PyPI to serve this version
        run: |
          # The registry fetches the package to verify ownership, so publishing
          # before PyPI's index has the new version fails on a race rather than
          # on anything real. Observed first-hand: the JSON API and the simple
          # index both lag the upload by a minute or more.
          VERSION=$(python3 -c "import re,pathlib;print(re.search(r'^version = \"(.+)\"',pathlib.Path('pyproject.toml').read_text(),re.M).group(1))")
          for i in $(seq 1 40); do
            if curl -sf "https://pypi.org/simple/hotin/" | grep -q "hotin-${VERSION}-py3"; then
              echo "PyPI serves ${VERSION}"; exit 0
            fi
            sleep 15
          done
          echo "::error::PyPI never served ${VERSION}; not publishing to the registry"
          exit 1
      - name: Publish
        run: |
          # Ownership is proven by the `mcp-name:` marker in the README that
          # renders on PyPI, which must match `name` in server.json. Both are
          # checked in tests/test_server_json.py so a rename cannot half-land.
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Verify the listing actually exists
        run: |
          # A publish that reports success and leaves nothing findable is the
          # failure this repo keeps meeting. Ask the registry, do not assume.
          sleep 10
          curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.abe238/hotin" \
            | grep -q "io.github.abe238/hotin" \
            || { echo "::error::published, but the registry does not list it"; exit 1; }
          echo "listed"
